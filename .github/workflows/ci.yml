name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dev dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Run ruff
        run: ruff check backend/

  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lmpc
          POSTGRES_USER: lmpc_user
          POSTGRES_PASSWORD: changeme_dev_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lmpc_user -d lmpc"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://lmpc_user:changeme_dev_only@localhost:5432/lmpc
      MINIO_ENDPOINT: http://localhost:9000
      MINIO_ROOT_USER: lmpc_minio_admin
      MINIO_ROOT_PASSWORD: changeme_dev_only
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Start MinIO
        run: |
          docker run -d --name minio \
            -p 9000:9000 -p 9001:9001 \
            -e MINIO_ROOT_USER=lmpc_minio_admin \
            -e MINIO_ROOT_PASSWORD=changeme_dev_only \
            minio/minio server /data --console-address ":9001"
          for i in $(seq 1 15); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 2
          done
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Apply migrations
        working-directory: backend
        run: alembic upgrade head
      - name: Run tests
        run: pytest backend/tests/

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build backend/
