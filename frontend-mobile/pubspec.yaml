name: lmpc_mobile
description: LMPC Inspector mobile app — camera capture, offline upload queue, scan status.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Camera viewfinder
  camera: ^0.10.5+9

  # Offline store (upload queue)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Background isolate for queue flush
  workmanager: ^0.5.2

  # Network state detection
  connectivity_plus: ^5.0.2

  # HTTP client — multipart upload + JSON status polling
  dio: ^5.4.3

  # JWT storage (secure enclave / Keystore)
  flutter_secure_storage: ^9.0.0

  # Simple state management (AuthProvider)
  provider: ^6.1.2

  # Gallery fallback when camera permission is denied
  image_picker: ^1.0.7

  # UUID generation for local offline IDs
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Code generator for Hive TypeAdapters
  hive_generator: ^2.0.1
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
